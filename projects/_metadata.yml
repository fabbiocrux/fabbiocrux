# Freeze computed outputs
execute: 
  freeze: true

# Enable banner style title blocks
title-block-banner: true

# Default fields for citation
citation: false

# Wrap overflow code

format: 
  html: 
    page-layout: article
    grid:
      sidebar-width: 250px
      body-width: 700px
      margin-width: 400px
      gutter-width: 2rem
    code-overflow: wrap
